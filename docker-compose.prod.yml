# Production stack — pulls prebuilt GHCR images instead of building.
# The deploy job sets API_IMAGE / WEB_IMAGE to immutable sha tags and provides
# JWT_SECRET. Run manually with:
#   API_IMAGE=ghcr.io/<owner>/<repo>-api:latest \
#   WEB_IMAGE=ghcr.io/<owner>/<repo>-web:latest \
#   JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d
#
# Postgres/Redis run in-stack for a one-box deploy; point DATABASE_URL/REDIS_URL
# at managed services instead for anything serious. DB/Redis ports are NOT
# published — only web (3000) and api (4000) are reachable from outside.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: moonbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: moonbite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonbite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: always
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://moonbite:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/moonbite?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET:?set DOWNLOAD_URL_SECRET}
      TRUST_PROXY: "1"
      # Transactional email (required in prod for verify/reset/receipts):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-MoonBite <no-reply@moonbite.example>}
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-}
      # MBITE node + real chain params — set these to go live (see LAUNCH.md):
      MBITE_RPC_URL: ${MBITE_RPC_URL:-}
      MBITE_RPC_USER: ${MBITE_RPC_USER:-}
      MBITE_RPC_PASSWORD: ${MBITE_RPC_PASSWORD:-}
      MBITE_ZMQ_RAWTX: ${MBITE_ZMQ_RAWTX:-}
      MBITE_ZMQ_RAWBLOCK: ${MBITE_ZMQ_RAWBLOCK:-}
      MBITE_BECH32_HRP: ${MBITE_BECH32_HRP:-}
      MBITE_PUBKEYHASH: ${MBITE_PUBKEYHASH:-}
      MBITE_SCRIPTHASH: ${MBITE_SCRIPTHASH:-}
      MBITE_WIF: ${MBITE_WIF:-}
      MBITE_BIP32_PUBLIC: ${MBITE_BIP32_PUBLIC:-}
      MBITE_BIP32_PRIVATE: ${MBITE_BIP32_PRIVATE:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
