name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: typecheck, unit tests, and production builds of both apps.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build -w @moonbite/shared
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit
      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Unit tests
        run: npm test -w @moonbite/api
      - name: Build API
        run: npm run build -w @moonbite/api
      - name: Build web
        run: npm run build -w @moonbite/web

  # Proof the whole stack boots and serves: build the images, bring up the full
  # compose stack, and hit the running API + web.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose --profile app up -d --build

      - name: Wait for API /health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ "$code" = "200" ]; then echo "API healthy"; exit 0; fi
            echo "waiting for API ($i)… got '$code'"; sleep 3
          done
          echo "API did not become healthy"; exit 1

      - name: Health reports status ok
        run: |
          curl -s http://localhost:4000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ]; then echo "web up"; exit 0; fi
            echo "waiting for web ($i)… got '$code'"; sleep 3
          done
          echo "web did not come up"; exit 1

      - name: Auth round-trip (register → login)
        run: |
          EMAIL="ci-$(date +%s)@example.com"
          reg=$(curl -s -X POST http://localhost:4000/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\",\"displayName\":\"CI\"}")
          echo "$reg" | grep -q 'accessToken' || { echo "register failed: $reg"; exit 1; }
          login=$(curl -s -X POST http://localhost:4000/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}")
          echo "$login" | grep -q 'accessToken' || { echo "login failed: $login"; exit 1; }
          echo "auth round-trip ok"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  # Build and push the api + web images to GitHub Container Registry.
  # Only on pushes to the default branch, and only after verify + e2e pass.
  publish:
    needs: [verify, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name automatically.
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* are baked at build; only the web image needs it.
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_BASE_URL={0}', vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:4000') || '' }}
