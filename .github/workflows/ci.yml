name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: typecheck, unit tests, and production builds of both apps.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build -w @moonbite/shared
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit
      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Unit tests
        run: npm test -w @moonbite/api
      - name: Build API
        run: npm run build -w @moonbite/api
      - name: Build web
        run: npm run build -w @moonbite/web

  # Proof the whole stack boots and serves: build the images, bring up the full
  # compose stack, and hit the running API + web.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose --profile app up -d --build

      - name: Wait for API /health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ "$code" = "200" ]; then echo "API healthy"; exit 0; fi
            echo "waiting for API ($i)… got '$code'"; sleep 3
          done
          echo "API did not become healthy"; exit 1

      - name: Health reports status ok
        run: |
          curl -s http://localhost:4000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ]; then echo "web up"; exit 0; fi
            echo "waiting for web ($i)… got '$code'"; sleep 3
          done
          echo "web did not come up"; exit 1

      - name: Auth round-trip (register → login)
        run: |
          EMAIL="ci-$(date +%s)@example.com"
          reg=$(curl -s -X POST http://localhost:4000/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\",\"displayName\":\"CI\"}")
          echo "$reg" | grep -q 'accessToken' || { echo "register failed: $reg"; exit 1; }
          login=$(curl -s -X POST http://localhost:4000/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}")
          echo "$login" | grep -q 'accessToken' || { echo "login failed: $login"; exit 1; }
          echo "auth round-trip ok"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  # Build and push the api + web images to GitHub Container Registry.
  # Only on pushes to the default branch, and only after verify + e2e pass.
  publish:
    needs: [verify, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name automatically.
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* are baked at build; only the web image needs it.
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_BASE_URL={0}', vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:4000') || '' }}

  # Deploy the just-published images to a Docker host over SSH. Pulls the exact
  # commit's images (immutable sha tags) and runs docker-compose.prod.yml there.
  # Requires secrets: SSH_HOST, SSH_USER, SSH_KEY, JWT_SECRET, POSTGRES_PASSWORD
  # (optional: SSH_PORT). The GitHub `production` environment can gate this with
  # required reviewers. Skips automatically if SSH_HOST is not configured.
  deploy:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy target is configured
        id: gate
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SSH_HOST secret set — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image refs (lowercased repo)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=ghcr.io/${REPO}-api:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${REPO}-web:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Copy compose file to server
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: moonbite

      - name: Pull images and roll out
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD,CORS_ORIGINS
          script: |
            set -e
            cd moonbite
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export API_IMAGE WEB_IMAGE JWT_SECRET POSTGRES_PASSWORD CORS_ORIGINS
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io

            # --- smoke test: the rollout only counts if it actually serves ---
            echo "Smoke test: waiting for API /health…"
            ok=0
            for i in $(seq 1 40); do
              code=$(curl -s -o /tmp/mb_health -w "%{http_code}" http://localhost:4000/health || true)
              if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/mb_health; then
                echo "API healthy"; ok=1; break
              fi
              echo "…waiting ($i) got '$code'"; sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "API failed smoke test — recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail=120 api
              exit 1
            fi

            echo "Smoke test: web root…"
            webcode=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$webcode" != "200" ]; then
              echo "Web failed smoke test (got '$webcode') — recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail=120 web
              exit 1
            fi

            echo "Smoke test passed."
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

      # Verify the deployment is reachable from OUTSIDE the host too (DNS, proxy,
      # firewall, TLS). Runs only if a public health URL is configured.
      - name: External smoke test
        if: steps.gate.outputs.enabled == 'true' && vars.DEPLOY_HEALTH_URL != ''
        run: |
          URL="${{ vars.DEPLOY_HEALTH_URL }}"
          echo "Probing $URL"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/h -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/h; then
              echo "External health ok"; exit 0
            fi
            echo "…waiting ($i) got '$code'"; sleep 3
          done
          echo "External health check failed for $URL"; cat /tmp/h || true; exit 1
