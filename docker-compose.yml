# MoonBite Partners.
#   docker compose up -d                       → infra only (Postgres + Redis)
#   docker compose --profile app up -d --build → full stack (infra + api + web)
#
# Infra starts by default; the api/web services are behind the "app" profile so
# `npm run infra:up` stays infra-only. The MBITE node is a placeholder — the
# stack runs without it (payments stay AWAITING, /health reports node down).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moonbite
      POSTGRES_PASSWORD: moonbite
      POSTGRES_DB: moonbite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonbite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://moonbite:moonbite@postgres:5432/moonbite?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      WEB_BASE_URL: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:4000
      # Local/CI-only secrets (NOT for production — satisfy env validation only).
      JWT_SECRET: local-ci-only-jwt-secret-0123456789abcdef
      DOWNLOAD_URL_SECRET: local-ci-only-download-secret-abcdef
      # MBITE_RPC_URL / MBITE_ZMQ_* left unset — node is optional for the demo.
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Static object store for SIGNED_DOWNLOAD deliverables (the real product
  # files). The API mints a short-lived signed /download URL that 302-redirects
  # here. Point STORAGE_BASE_URL at this host.
  content:
    profiles: ["app"]
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./content:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  # ── MBITE full node (PLACEHOLDER) ────────────────────────────
  # The payment service talks to this over JSON-RPC + ZMQ.
  # TODO(Phase 0): swap in the real MoonBite node image/build and
  # mount a config enabling: rpc, txindex=1, and ZMQ publishers.
  #
  # mbite-node:
  #   image: moonbite/node:latest
  #   restart: unless-stopped
  #   command: >
  #     -server=1 -txindex=1 -rpcuser=moonbite -rpcpassword=change-me
  #     -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0
  #     -zmqpubrawtx=tcp://0.0.0.0:28332
  #     -zmqpubrawblock=tcp://0.0.0.0:28333
  #   ports:
  #     - "9332:9332"   # rpc
  #     - "28332:28332" # zmq rawtx
  #     - "28333:28333" # zmq rawblock
  #   volumes:
  #     - mbitedata:/root/.mbite

volumes:
  pgdata:
  redisdata:
